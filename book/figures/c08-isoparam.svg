<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Isoparam: lines follow the surface's own U/V grid. Green = new edges, grey dots = CVs. -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="163" height="124" rx="5"/>
    <rect x="173.6" y="0.5" width="163" height="124" rx="5"/>
    <rect x="346.7" y="0.5" width="163" height="124" rx="5"/>
  </g>

  <!-- surface patches (cx = 82 / 255.1 / 428.2) -->
  <g fill="#ffffff" stroke="#1d1f24" stroke-width="1.2">
    <path d="M32,30 Q82,18 132,30 L132,85 Q82,73 32,85 Z"/>
    <path d="M205.1,30 Q255.1,18 305.1,30 L305.1,85 Q255.1,73 205.1,85 Z"/>
    <path d="M378.2,30 Q428.2,18 478.2,30 L478.2,85 Q428.2,73 378.2,85 Z"/>
  </g>

  <!-- 1: three lines one way -->
  <g stroke="#0f8a5f" stroke-width="1.8" fill="none">
    <line x1="57" y1="25.5" x2="57" y2="80.5"/>
    <line x1="82" y1="24" x2="82" y2="79"/>
    <line x1="107" y1="25.5" x2="107" y2="80.5"/>
    <!-- 2: three lines the other way -->
    <path d="M205.1,43.75 Q255.1,31.75 305.1,43.75"/>
    <path d="M205.1,57.5 Q255.1,45.5 305.1,57.5"/>
    <path d="M205.1,71.25 Q255.1,59.25 305.1,71.25"/>
    <!-- 3: subdivide in half -->
    <line x1="428.2" y1="24" x2="428.2" y2="79"/>
  </g>

  <!-- 3: same CV layout on both halves -->
  <g fill="#6b7080">
    <circle cx="390.7" cy="35" r="1.6"/><circle cx="403.2" cy="33" r="1.6"/><circle cx="415.7" cy="32" r="1.6"/>
    <circle cx="390.7" cy="54" r="1.6"/><circle cx="403.2" cy="52" r="1.6"/><circle cx="415.7" cy="51" r="1.6"/>
    <circle cx="390.7" cy="73" r="1.6"/><circle cx="403.2" cy="71" r="1.6"/><circle cx="415.7" cy="70" r="1.6"/>
    <circle cx="440.7" cy="32" r="1.6"/><circle cx="453.2" cy="33" r="1.6"/><circle cx="465.7" cy="35" r="1.6"/>
    <circle cx="440.7" cy="51" r="1.6"/><circle cx="453.2" cy="52" r="1.6"/><circle cx="465.7" cy="54" r="1.6"/>
    <circle cx="440.7" cy="70" r="1.6"/><circle cx="453.2" cy="71" r="1.6"/><circle cx="465.7" cy="73" r="1.6"/>
  </g>

  <g text-anchor="middle">
    <text x="82" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Count 3</text>
    <text x="82" y="117" font-size="6.5" fill="#6b7080">Shift+Wheel adds or removes lines</text>
    <text x="255.1" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Tab</text>
    <text x="255.1" y="117" font-size="6.5" fill="#6b7080">switches between U and V</text>
    <text x="428.2" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Subdivide (S)</text>
    <text x="428.2" y="117" font-size="6.5" fill="#6b7080">splits in half, both halves keep the CV layout</text>
  </g>
</svg>
