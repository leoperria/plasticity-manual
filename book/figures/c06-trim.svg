<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Trim: overlapping lines / click a segment (bounded by the nearest intersection) / clean profile.
       Style: see docs/diagram-style.md -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="163" height="124" rx="5"/>
    <rect x="173.6" y="0.5" width="163" height="124" rx="5"/>
    <rect x="346.7" y="0.5" width="163" height="124" rx="5"/>
  </g>

  <!-- 1 overlapping curves: rectangle x 52..112, y 35..75, overhangs 20 / 18 -->
  <g stroke="#1d1f24" stroke-width="1.2" fill="none">
    <line x1="32" y1="35" x2="132" y2="35"/>
    <line x1="32" y1="75" x2="132" y2="75"/>
    <line x1="52" y1="17" x2="52" y2="93"/>
    <line x1="112" y1="17" x2="112" y2="93"/>
  </g>

  <!-- 2 click a segment (offset +173.1) -->
  <g stroke="#1d1f24" stroke-width="1.2" fill="none">
    <line x1="225.1" y1="35" x2="305.1" y2="35"/>
    <line x1="205.1" y1="75" x2="305.1" y2="75"/>
    <line x1="225.1" y1="17" x2="225.1" y2="93"/>
    <line x1="285.1" y1="17" x2="285.1" y2="93"/>
  </g>
  <line x1="205.1" y1="35" x2="225.1" y2="35" stroke="#e8a400" stroke-width="3"/>
  <g fill="#1d1f24" stroke="#ffffff" stroke-width="0.6">
    <circle cx="225.1" cy="35" r="2"/><circle cx="285.1" cy="35" r="2"/>
    <circle cx="225.1" cy="75" r="2"/><circle cx="285.1" cy="75" r="2"/>
  </g>
  <!-- cursor -->
  <path transform="translate(212,38)" d="M0,0 L0,11 L3,8 L5.5,13 L7.3,12.2 L4.8,7.3 L9,7.3 Z"
        fill="#ffffff" stroke="#1d1f24" stroke-width="0.8" stroke-linejoin="round"/>
  <text x="229" y="31" font-size="6" fill="#1d1f24">intersection</text>

  <!-- 3 result (offset +346.2) -->
  <g stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2" fill="none">
    <line x1="378.2" y1="35" x2="398.2" y2="35"/><line x1="458.2" y1="35" x2="478.2" y2="35"/>
    <line x1="378.2" y1="75" x2="398.2" y2="75"/><line x1="458.2" y1="75" x2="478.2" y2="75"/>
    <line x1="398.2" y1="17" x2="398.2" y2="35"/><line x1="398.2" y1="75" x2="398.2" y2="93"/>
    <line x1="458.2" y1="17" x2="458.2" y2="35"/><line x1="458.2" y1="75" x2="458.2" y2="93"/>
  </g>
  <rect x="398.2" y="35" width="60" height="40" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>

  <g text-anchor="middle">
    <text x="82" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Overlapping curves</text>
    <text x="82" y="117" font-size="6.5" fill="#6b7080">lines drawn a little too long</text>
    <text x="255.1" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Press T, click a segment</text>
    <text x="255.1" y="117" font-size="6.5" fill="#6b7080">only the piece up to the intersection goes</text>
    <text x="428.2" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Result</text>
    <text x="428.2" y="117" font-size="6.5" fill="#6b7080">after clicking each overhang</text>
  </g>
</svg>
