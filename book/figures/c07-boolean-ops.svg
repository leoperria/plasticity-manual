<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Boolean operations on a square target and a round tool (top view).
       Grey dashed = original target and tool; violet = result.
       Slice: three pieces, matching the official solid/solid comparison image. Style: see docs/diagram-style.md
       Panel centres c = 60.75 / 190.35 / 319.95 / 449.55. Square: x c-35..c+9, y 28..72.
       Tool circle: centre (c+14, 50), r 20; it crosses x = c+9 at y = 30.635 and 69.365. -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="130.1" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="259.7" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="389.3" y="0.5" width="120.5" height="124" rx="5"/>
  </g>
  <text x="8" y="13" font-size="6" fill="#6b7080">top view</text>

  <!-- labels for target and tool, every panel -->
  <g font-size="6" fill="#6b7080">
    <text x="25.75" y="24">target</text><text x="70.75" y="24">tool</text>
    <text x="155.35" y="24">target</text><text x="200.35" y="24">tool</text>
    <text x="284.95" y="24">target</text><text x="329.95" y="24">tool</text>
    <text x="414.55" y="24">target</text><text x="459.55" y="24">tool</text>
  </g>

  <!-- 1 Union (c 60.75) -->
  <path d="M25.75,28 L69.75,28 L69.75,30.635 A20,20 0 1 1 69.75,69.365 L69.75,72 L25.75,72 Z" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>

  <!-- 2 Difference (c 190.35) -->
  <circle cx="204.35" cy="50" r="20" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M155.35,28 L199.35,28 L199.35,30.635 A20,20 0 0 0 199.35,69.365 L199.35,72 L155.35,72 Z" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>

  <!-- 3 Intersect (c 319.95) -->
  <rect x="284.95" y="28" width="44" height="44" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <circle cx="333.95" cy="50" r="20" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M328.95,30.635 A20,20 0 0 0 328.95,69.365 Z" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>

  <!-- 4 Slice (c 449.55): three separate solids, drawn slightly apart, as in the official
       comparison image (solid target, solid tool) on https://doc.plasticity.xyz/solid/boolean -->
  <path d="M414.55,28 L458.55,28 L458.55,30.635 A20,20 0 0 0 458.55,69.365 L458.55,72 L414.55,72 Z" transform="translate(-3 0)" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>
  <path d="M458.55,30.635 A20,20 0 0 0 458.55,69.365 Z" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>
  <path d="M458.55,30.635 A20,20 0 1 1 458.55,69.365 Z" transform="translate(3 0)" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>
  <text x="449.55" y="84" font-size="6" fill="#5b3df5" text-anchor="middle">3 separate solids</text>

  <g text-anchor="middle">
    <text x="60.75" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Union (Q)</text>
    <text x="60.75" y="117" font-size="6.5" fill="#6b7080">target and tool joined</text>
    <text x="190.35" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Difference (W)</text>
    <text x="190.35" y="117" font-size="6.5" fill="#6b7080">tool removed from target</text>
    <text x="319.95" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Intersect (Shift+E)</text>
    <text x="319.95" y="117" font-size="6.5" fill="#6b7080">only the overlap is kept</text>
    <text x="449.55" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Slice (Shift+Q)</text>
    <text x="449.55" y="117" font-size="6.5" fill="#6b7080">overlap and both remainders</text>
  </g>
</svg>
