<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Push Face: before / push out / pull in (side view). Style: see docs/diagram-style.md -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b3df5"/>
    </marker>
  </defs>
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="163" height="124" rx="5"/>
    <rect x="173.6" y="0.5" width="163" height="124" rx="5"/>
    <rect x="346.7" y="0.5" width="163" height="124" rx="5"/>
  </g>
  <text x="8" y="13" font-size="6" fill="#6b7080">side view</text>

  <!-- 1 before -->
  <rect x="37" y="45" width="90" height="43" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <line x1="37" y1="45" x2="127" y2="45" stroke="#e8a400" stroke-width="3"/>
  <circle cx="82" cy="45" r="3.5" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>

  <!-- 2 push out -->
  <rect x="210.1" y="45" width="90" height="43" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <rect x="210.1" y="27" width="90" height="61" fill="#efecff" stroke="none"/>
  <line x1="210.1" y1="88" x2="300.1" y2="88" stroke="#1d1f24" stroke-width="1.2"/>
  <line x1="210.1" y1="27" x2="210.1" y2="88" stroke="#5b3df5" stroke-width="1.6"/>
  <line x1="300.1" y1="27" x2="300.1" y2="88" stroke="#5b3df5" stroke-width="1.6"/>
  <line x1="210.1" y1="27" x2="300.1" y2="27" stroke="#e8a400" stroke-width="3"/>
  <line x1="255.1" y1="62" x2="255.1" y2="33" stroke="#5b3df5" stroke-width="1.2" marker-end="url(#arr)"/>
  <circle cx="255.1" cy="27" r="3.5" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>

  <!-- 3 pull in -->
  <rect x="383.2" y="45" width="90" height="43" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <rect x="383.2" y="63" width="90" height="25" fill="#efecff" stroke="none"/>
  <line x1="383.2" y1="88" x2="473.2" y2="88" stroke="#1d1f24" stroke-width="1.2"/>
  <line x1="383.2" y1="63" x2="383.2" y2="88" stroke="#5b3df5" stroke-width="1.6"/>
  <line x1="473.2" y1="63" x2="473.2" y2="88" stroke="#5b3df5" stroke-width="1.6"/>
  <line x1="383.2" y1="63" x2="473.2" y2="63" stroke="#e8a400" stroke-width="3"/>
  <line x1="428.2" y1="40" x2="428.2" y2="57" stroke="#5b3df5" stroke-width="1.2" marker-end="url(#arr)"/>
  <circle cx="428.2" cy="63" r="3.5" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>

  <g text-anchor="middle">
    <text x="82" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Before</text>
    <text x="82" y="117" font-size="6.5" fill="#6b7080">select the face (Face mode, 3)</text>
    <text x="255.1" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Drag the yellow dot out</text>
    <text x="255.1" y="117" font-size="6.5" fill="#6b7080">the side faces stretch to follow</text>
    <text x="428.2" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Drag it in</text>
    <text x="428.2" y="117" font-size="6.5" fill="#6b7080">the side faces shorten to follow</text>
  </g>
</svg>
