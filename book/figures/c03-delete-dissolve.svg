<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Delete vs Dissolve on a group (Outliner view). Style: see docs/diagram-style.md -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="163" height="124" rx="5"/>
    <rect x="173.6" y="0.5" width="163" height="124" rx="5"/>
    <rect x="346.7" y="0.5" width="163" height="124" rx="5"/>
  </g>
  <rect x="28.5" y="26" width="100" height="14" rx="2" fill="#fbe7a6" stroke="#e8a400" stroke-width="1.5"/>
  <path d="M34.5,30 h4 l1.5,1.5 h5.5 v6.5 h-11 z" fill="#ffffff" stroke="#1d1f24" stroke-width="0.8"/>
  <text x="50.5" y="36" font-size="7" font-weight="bold" fill="#1d1f24">Bracket</text>
  <rect x="48.5" y="46" width="7" height="7" rx="1" fill="#dfe2e9" stroke="#1d1f24" stroke-width="0.8"/>
  <text x="60.5" y="52" font-size="7" fill="#1d1f24">Box.000</text>
  <rect x="48.5" y="62" width="7" height="7" rx="1" fill="#dfe2e9" stroke="#1d1f24" stroke-width="0.8"/>
  <text x="60.5" y="68" font-size="7" fill="#1d1f24">Cylinder.000</text>
  <line x1="39.5" y1="39" x2="39.5" y2="65.5" stroke="#6b7080" stroke-width="0.6"/>
  <line x1="39.5" y1="49.5" x2="46.5" y2="49.5" stroke="#6b7080" stroke-width="0.6"/>
  <line x1="39.5" y1="65.5" x2="46.5" y2="65.5" stroke="#6b7080" stroke-width="0.6"/>
  <text x="28.5" y="22" font-size="6" fill="#e8a400">group selected</text>
  <path d="M207.6,30 h4 l1.5,1.5 h5.5 v6.5 h-11 z" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <text x="223.6" y="36" font-size="7" font-weight="bold" text-decoration="line-through" fill="#6b7080">Bracket</text>
  <rect x="221.6" y="46" width="7" height="7" rx="1" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <text x="233.6" y="52" font-size="7" text-decoration="line-through" fill="#6b7080">Box.000</text>
  <rect x="221.6" y="62" width="7" height="7" rx="1" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <text x="233.6" y="68" font-size="7" text-decoration="line-through" fill="#6b7080">Cylinder.000</text>
  <text x="201.6" y="84" font-size="6" fill="#6b7080">group and objects are gone</text>
  <path d="M380.7,30 h4 l1.5,1.5 h5.5 v6.5 h-11 z" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <text x="396.7" y="36" font-size="7" font-weight="bold" text-decoration="line-through" fill="#6b7080">Bracket</text>
  <rect x="380.7" y="46" width="7" height="7" rx="1" fill="#dfe2e9" stroke="#5b3df5" stroke-width="0.8"/>
  <text x="392.7" y="52" font-size="7" fill="#5b3df5">Box.000</text>
  <rect x="380.7" y="62" width="7" height="7" rx="1" fill="#dfe2e9" stroke="#5b3df5" stroke-width="0.8"/>
  <text x="392.7" y="68" font-size="7" fill="#5b3df5">Cylinder.000</text>
  <text x="374.7" y="84" font-size="6" fill="#5b3df5">the objects are kept</text>
  <g text-anchor="middle">
    <text x="82.0" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Before</text>
    <text x="82.0" y="117" font-size="6.5" fill="#6b7080">a group with two objects</text>
    <text x="255.1" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Delete (Shift+Backspace)</text>
    <text x="255.1" y="117" font-size="6.5" fill="#6b7080">removes the group and its contents</text>
    <text x="428.2" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Dissolve (X or Backspace)</text>
    <text x="428.2" y="117" font-size="6.5" fill="#6b7080">removes only the group</text>
  </g>
</svg>
