  <text x="319.95" y="44" font-size="6" fill="#5b3df5" text-anchor="middle">one body</text>
  <line x1="449.55" y1="17" x2="449.55" y2="90" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
