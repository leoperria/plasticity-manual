<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Mirror: default, Union halves, Cut down mirror plane (side view). Dashed line = mirror plane. Style: see docs/DIAGRAM-STYLE.md -->
  <defs>
