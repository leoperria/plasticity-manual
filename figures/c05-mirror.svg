  <polygon points="190.35,30 230.35,30 230.35,80 212.35,80 212.35,52 190.35,52" fill="#efecff" stroke="#5b3df5" stroke-width="1.6"/>
  <path d="M178.35,86 Q190.35,94 202.35,86" fill="none" stroke="#5b3df5" stroke-width="1" marker-end="url(#v)"/>
  <text x="159.35" y="91" font-size="6" fill="#1d1f24" text-anchor="middle">original</text>
  <text x="221.35" y="91" font-size="6" fill="#5b3df5" text-anchor="middle">copy</text>
