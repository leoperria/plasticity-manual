<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Fillet Curve / Fillet Vertex: corner selected / fillet (tangent arc) / chamfer (straight cut).
       Corner at (52,22) in panel 1, legs to (52,92) and (122,22); radius / chamfer distance 25.
       Style: see docs/DIAGRAM-STYLE.md -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="163" height="124" rx="5"/>
    <rect x="173.6" y="0.5" width="163" height="124" rx="5"/>
    <rect x="346.7" y="0.5" width="163" height="124" rx="5"/>
  </g>

  <!-- 1 before: two segments, corner vertex selected -->
  <path d="M52,92 L52,22 L122,22" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <circle cx="52" cy="22" r="3.5" fill="#e8a400" stroke="#1d1f24" stroke-width="0.6"/>
  <text x="58" y="34" font-size="6" fill="#e8a400">selected vertex</text>

  <!-- 2 fillet (offset +173.1) -->
  <path d="M225.1,47 L225.1,22 L250.1,22" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M225.1,92 L225.1,47" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M250.1,22 L295.1,22" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M225.1,47 A25,25 0 0 1 250.1,22" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <line x1="250.1" y1="47" x2="232.42" y2="29.32" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="246" y="56" font-size="6" fill="#5b3df5">radius</text>

  <!-- 3 chamfer (offset +346.2) -->
  <path d="M398.2,47 L398.2,22 L423.2,22" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M398.2,92 L398.2,47" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M423.2,22 L468.2,22" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <line x1="398.2" y1="47" x2="423.2" y2="22" stroke="#5b3df5" stroke-width="1.8"/>
  <text x="410" y="44" font-size="6" fill="#5b3df5">chamfer distance</text>

  <g text-anchor="middle">
    <text x="82" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Select the corner, press B</text>
    <text x="82" y="117" font-size="6.5" fill="#6b7080">the vertex, or the two segments</text>
    <text x="255.1" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Fillet (D)</text>
    <text x="255.1" y="117" font-size="6.5" fill="#6b7080">a rounded corner</text>
    <text x="428.2" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Chamfer (C)</text>
    <text x="428.2" y="117" font-size="6.5" fill="#6b7080">a straight cut across the corner</text>
  </g>
</svg>
