<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Fillet Shell: fillet vs chamfer, Chordal (same chord at different angles), Full (sections).
       Grey dashed = original corner. Style: see docs/DIAGRAM-STYLE.md -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="130.1" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="259.7" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="389.3" y="0.5" width="120.5" height="124" rx="5"/>
  </g>
  <text x="8" y="13" font-size="6" fill="#6b7080">section views</text>

  <!-- 1 fillet: positive distance (corner at 90.75,35; R 22) -->
  <path d="M20.75,35 L68.75,35 A22,22 0 0 1 90.75,57 L90.75,88 L20.75,88 Z" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M68.75,35 L90.75,35 L90.75,57" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M68.75,35 A22,22 0 0 1 90.75,57" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <circle cx="84.31" cy="41.44" r="3.5" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>
  <text x="55" y="65" font-size="6" fill="#5b3df5" text-anchor="middle">Distance &gt; 0</text>

  <!-- 2 chamfer: negative distance (corner at 220.35,35) -->
  <path d="M150.35,35 L198.35,35 L220.35,57 L220.35,88 L150.35,88 Z" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M198.35,35 L220.35,35 L220.35,57" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="198.35" y1="35" x2="220.35" y2="57" stroke="#5b3df5" stroke-width="1.8"/>
  <circle cx="209.35" cy="46" r="3.5" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>
  <text x="185" y="65" font-size="6" fill="#5b3df5" text-anchor="middle">Distance &lt; 0</text>

  <!-- 3 Chordal: a 135-degree corner (left) and a 90-degree corner (right), both with a chord of 20 -->
  <path d="M274.95,88 L274.95,60.82 A26.13,26.13 0 0 1 282.60,42.35 L294.95,30 L345.81,30 A14.14,14.14 0 0 1 359.95,44.14 L359.95,88 Z" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M274.95,60.82 A26.13,26.13 0 0 1 282.60,42.35" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <path d="M345.81,30 A14.14,14.14 0 0 1 359.95,44.14" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <path d="M274.95,60.82 L274.95,50 L282.60,42.35" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M345.81,30 L359.95,30 L359.95,44.14" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="274.95" y1="60.82" x2="282.60" y2="42.35" stroke="#0f8a5f" stroke-width="1" stroke-dasharray="2 1.5"/>
  <line x1="345.81" y1="30" x2="359.95" y2="44.14" stroke="#0f8a5f" stroke-width="1" stroke-dasharray="2 1.5"/>
  <line x1="300" y1="54" x2="280.5" y2="52" stroke="#0f8a5f" stroke-width="0.6"/>
  <line x1="335" y1="54" x2="352" y2="38" stroke="#0f8a5f" stroke-width="0.6"/>
  <text x="317.5" y="58" font-size="6" fill="#0f8a5f" text-anchor="middle">same chord</text>
  <text x="317.5" y="65" font-size="6" fill="#0f8a5f" text-anchor="middle">length</text>

  <!-- 4 Full: top face of a rib replaced by a round tangent to left, top and right -->
  <path d="M404.55,88 L404.55,72 L434.55,72 L434.55,45 A15,15 0 0 1 464.55,45 L464.55,72 L494.55,72 L494.55,88 Z" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M434.55,45 L434.55,30 L464.55,30 L464.55,45" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M434.55,45 A15,15 0 0 1 464.55,45" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <circle cx="434.55" cy="30" r="2.6" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>
  <circle cx="464.55" cy="30" r="2.6" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>
  <text x="449.55" y="22" font-size="6" fill="#9a6d00" text-anchor="middle">2 edges of the centre face</text>
  <g font-size="6" fill="#6b7080" text-anchor="middle">
    <text x="420" y="58">left</text><text x="479" y="58">right</text>
  </g>

  <g text-anchor="middle">
    <text x="60.75" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Fillet</text>
    <text x="60.75" y="117" font-size="6.5" fill="#6b7080">positive distance</text>
    <text x="190.35" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Chamfer</text>
    <text x="190.35" y="117" font-size="6.5" fill="#6b7080">negative distance</text>
    <text x="319.95" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Chordal</text>
    <text x="319.95" y="117" font-size="6.5" fill="#6b7080">same chord at any angle</text>
    <text x="449.55" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Full</text>
    <text x="449.55" y="117" font-size="6.5" fill="#6b7080">tangent to all three faces</text>
  </g>
</svg>
