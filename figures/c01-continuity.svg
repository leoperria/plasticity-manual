  <g font-size="6.5" fill="#6b7080" text-anchor="middle">
    <text x="60.75" y="92">ends meet; a corner is allowed</text>
    <text x="190.35" y="92">G0 + same direction</text>
    <text x="319.95" y="92">G1 + same curvature</text>
    <text x="449.55" y="92">G2 + same curvature change</text>
  </g>
</svg>
