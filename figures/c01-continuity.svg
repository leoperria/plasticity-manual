    <rect x="259.7" y="0.5" width="120.5" height="99" rx="5"/>
    <rect x="389.3" y="0.5" width="120.5" height="99" rx="5"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <line x1="16" y1="58" x2="56" y2="58" stroke="#1d1f24" stroke-width="1.6"/>
    <path d="M 56 58 L 102 22" stroke="#5b3df5" stroke-width="1.8"/>
    <line x1="145.6" y1="58" x2="185.6" y2="58" stroke="#1d1f24" stroke-width="1.6"/>
    <path d="M 185.6 58 Q 212 58 232 22" stroke="#5b3df5" stroke-width="1.8"/>
    <line x1="275.2" y1="58" x2="315.2" y2="58" stroke="#1d1f24" stroke-width="1.6"/>
    <path d="M 315.2 58 C 331 58 345 58 362 22" stroke="#5b3df5" stroke-width="1.8"/>
    <line x1="404.8" y1="58" x2="444.8" y2="58" stroke="#1d1f24" stroke-width="1.6"/>
    <path d="M 444.8 58 C 464 58 476 58 493 24" stroke="#5b3df5" stroke-width="1.8"/>
  </g>
  <g fill="#ffffff" stroke="#1d1f24" stroke-width="1">
    <circle cx="56" cy="58" r="2.6"/>
    <circle cx="185.6" cy="58" r="2.6"/>
    <circle cx="315.2" cy="58" r="2.6"/>
    <circle cx="444.8" cy="58" r="2.6"/>
  </g>
  <g font-size="8" font-weight="bold" fill="#1d1f24" text-anchor="middle">
    <text x="60.75" y="81">G0 · Position</text>
    <text x="190.35" y="81">G1 · Tangent</text>
    <text x="319.95" y="81">G2 · Curvature</text>
