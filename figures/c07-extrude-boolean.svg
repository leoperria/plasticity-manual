<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Extrude: a region on the top face of a box, extruded with three target modes (side view).
       Style: see docs/DIAGRAM-STYLE.md -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b3df5"/>
    </marker>
  </defs>
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="130.1" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="259.7" y="0.5" width="120.5" height="124" rx="5"/>
    <rect x="389.3" y="0.5" width="120.5" height="124" rx="5"/>
  </g>
  <text x="8" y="13" font-size="6" fill="#6b7080">side view</text>

  <!-- 1 before (cx 60.75) -->
  <rect x="20.75" y="55" width="80" height="33" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <line x1="40.75" y1="55" x2="80.75" y2="55" stroke="#e8a400" stroke-width="3"/>
  <circle cx="60.75" cy="55" r="3.5" fill="#f5c518" stroke="#1d1f24" stroke-width="0.6"/>
  <text x="60.75" y="47" font-size="6" fill="#9a6d00" text-anchor="middle">region on the top face</text>

  <!-- 2 union (cx 190.35): one body -->
  <path d="M150.35,55 L170.35,55 L170.35,28 L210.35,28 L210.35,55 L230.35,55 L230.35,88 L150.35,88 Z" fill="#ffffff" stroke="none"/>
  <rect x="170.35" y="28" width="40" height="27" fill="#efecff" stroke="none"/>
  <path d="M170.35,55 L150.35,55 L150.35,88 L230.35,88 L230.35,55 L210.35,55" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <path d="M170.35,55 L170.35,28 L210.35,28 L210.35,55" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <line x1="190.35" y1="50" x2="190.35" y2="34" stroke="#5b3df5" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 3 difference (cx 319.95): pocket -->
  <path d="M279.95,55 L299.95,55 L299.95,73 L339.95,73 L339.95,55 L359.95,55 L359.95,88 L279.95,88 Z" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <rect x="299.95" y="55" width="40" height="18" fill="none" stroke="#6b7080" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M299.95,55 L299.95,73 L339.95,73 L339.95,55" fill="none" stroke="#5b3df5" stroke-width="1.8"/>
  <line x1="319.95" y1="40" x2="319.95" y2="66" stroke="#5b3df5" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="319.95" y="35" font-size="6" fill="#6b7080" text-anchor="middle">extruded into the body</text>

  <!-- 4 new body (cx 449.55): separate solid -->
  <rect x="409.55" y="55" width="80" height="33" fill="#ffffff" stroke="#1d1f24" stroke-width="1.2"/>
  <rect x="429.55" y="28" width="40" height="27" fill="#efecff" stroke="#5b3df5" stroke-width="1.8"/>
  <text x="449.55" y="22" font-size="6" fill="#5b3df5" text-anchor="middle">separate body</text>
  <line x1="449.55" y1="50" x2="449.55" y2="34" stroke="#5b3df5" stroke-width="1.2" marker-end="url(#arr)"/>

  <g text-anchor="middle">
    <text x="60.75" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Before</text>
    <text x="60.75" y="117" font-size="6.5" fill="#6b7080">select the region, press E</text>
    <text x="190.35" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Union (Q)</text>
    <text x="190.35" y="117" font-size="6.5" fill="#6b7080">joined to the box: one solid</text>
    <text x="319.95" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Difference (W)</text>
    <text x="319.95" y="117" font-size="6.5" fill="#6b7080">cut out of the box: a pocket</text>
    <text x="449.55" y="106" font-size="8" font-weight="bold" fill="#1d1f24">New Body (B)</text>
    <text x="449.55" y="117" font-size="6.5" fill="#6b7080">a separate solid; box unchanged</text>
  </g>
</svg>
