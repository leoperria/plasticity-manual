<svg xmlns="http://www.w3.org/2000/svg" width="510.2362" height="125" viewBox="0 0 510.2362 125" font-family="DejaVu Sans">
  <!-- Loft vs Sweep vs Pipe: what each one needs and makes. Style: see docs/DIAGRAM-STYLE.md -->
  <g fill="#f6f6fa" stroke="#d9dbe3" stroke-width="0.8">
    <rect x="0.5" y="0.5" width="163" height="124" rx="5"/>
    <rect x="173.6" y="0.5" width="163" height="124" rx="5"/>
    <rect x="346.7" y="0.5" width="163" height="124" rx="5"/>
  </g>

  <!-- 1 Loft (cx 82): three profiles, surface through them -->
  <path d="M52,85 C52,70 66,64 64,55 C62,45 54,35 56,25 L108,25 C110,35 102,45 100,55 C98,64 112,70 112,85 Z" fill="#efecff" stroke="none"/>
  <path d="M52,85 C52,70 66,64 64,55 C62,45 54,35 56,25" fill="none" stroke="#5b3df5" stroke-width="1.6"/>
  <path d="M112,85 C112,70 98,64 100,55 C102,45 110,35 108,25" fill="none" stroke="#5b3df5" stroke-width="1.6"/>
  <g fill="none" stroke="#1d1f24" stroke-width="1.2">
    <ellipse cx="82" cy="85" rx="30" ry="6"/>
    <ellipse cx="82" cy="55" rx="18" ry="4"/>
    <ellipse cx="82" cy="25" rx="26" ry="5"/>
  </g>
  <g font-size="7" font-weight="bold" fill="#1d1f24">
    <text x="117" y="88">1</text>
    <text x="104" y="58">2</text>
    <text x="113" y="28">3</text>
  </g>
  <text x="20" y="58" font-size="6" fill="#1d1f24">profiles</text>

  <!-- 2 Sweep (cx 255.1): one profile moved along a path -->
  <path d="M200,80 C235,80 245,40 300,38" fill="none" stroke="#5b3df5" stroke-width="18" stroke-linecap="butt"/>
  <path d="M200,80 C235,80 245,40 300,38" fill="none" stroke="#efecff" stroke-width="14.4" stroke-linecap="butt"/>
  <path d="M200,80 C235,80 245,40 300,38" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <rect x="196" y="71" width="8" height="18" fill="#ffffff" stroke="#e8a400" stroke-width="2"/>
  <rect x="296.3" y="29" width="8" height="18" transform="rotate(-2 300 38)" fill="#efecff" stroke="#5b3df5" stroke-width="1.4"/>
  <text x="200" y="98" font-size="6" fill="#9a6d00" text-anchor="middle">profile</text>
  <text x="262" y="72" font-size="6" fill="#1d1f24">path</text>
  <line x1="261" y1="70" x2="252" y2="60" stroke="#1d1f24" stroke-width="0.6"/>

  <!-- 3 Pipe (cx 428.2): a round section of set size along a curve -->
  <path d="M373,80 C408,80 418,40 473,38" fill="none" stroke="#5b3df5" stroke-width="16" stroke-linecap="butt"/>
  <path d="M373,80 C408,80 418,40 473,38" fill="none" stroke="#efecff" stroke-width="12.4" stroke-linecap="butt"/>
  <path d="M373,80 C408,80 418,40 473,38" fill="none" stroke="#1d1f24" stroke-width="1.2"/>
  <ellipse cx="473" cy="38" rx="4" ry="8" fill="#efecff" stroke="#5b3df5" stroke-width="1.4"/>
  <ellipse cx="473" cy="38" rx="2" ry="4.5" fill="#ffffff" stroke="#5b3df5" stroke-width="1"/>
  <text x="468" y="23" font-size="6" fill="#5b3df5">Diameter</text>
  <text x="458" y="62" font-size="6" fill="#5b3df5">Thickness</text>
  <text x="435" y="72" font-size="6" fill="#1d1f24">curve or edge</text>
  <line x1="434" y1="70" x2="425" y2="60" stroke="#1d1f24" stroke-width="0.6"/>

  <g text-anchor="middle">
    <text x="82" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Loft (L)</text>
    <text x="82" y="117" font-size="6.5" fill="#6b7080">through several profiles, in selection order</text>
    <text x="255.1" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Sweep (Shift+P)</text>
    <text x="255.1" y="117" font-size="6.5" fill="#6b7080">one profile moved along a path curve</text>
    <text x="428.2" y="106" font-size="8" font-weight="bold" fill="#1d1f24">Pipe (P)</text>
    <text x="428.2" y="117" font-size="6.5" fill="#6b7080">a section of set size along each curve</text>
  </g>
</svg>
