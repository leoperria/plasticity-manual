name: Build manual
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc and fonts
        run: sudo apt-get update && sudo apt-get install -y pandoc fonts-dejavu-core
      - uses: typst-community/setup-typst@v4
      - name: Build PDF
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Plasticity_Manual
          path: build/Plasticity_Manual_*.pdf
